<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة بورصة</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><header><div class="wrap topbar"><b>بورصة <small>لوحة الإدارة</small></b><div><span id="adminEmail"></span><a href="index.html">عرض الموقع ↗</a><button id="logout" hidden>تسجيل الخروج</button></div></div></header>
<main class="wrap">
<section id="loginView" class="login-card"><div class="lock">⌑</div><h1>دخول الإدارة</h1><p>استخدم حساب المدير الذي أنشأته في Supabase Auth.</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" id="loginBtn">تسجيل الدخول</button></form><p id="loginError" class="error"></p></section>
<section id="dashboard" hidden>
<div class="stats"><article><small>إجمالي السيارات</small><b id="statCars">0</b></article><article><small>طلبات الاهتمام الجديدة</small><b id="statLeads">0</b></article><article><small>الأقسام</small><b id="statCats">0</b></article></div>
<div class="tabs"><button class="active" data-tab="cars">السيارات</button><button data-tab="leads">طلبات الاهتمام</button><button data-tab="categories">الأقسام</button></div>
<section id="carsTab" class="panel columns"><div><h2 id="formHeading">إضافة سيارة</h2><form id="carForm">
<input id="carId" type="hidden"><label>عنوان السيارة<input id="title" required maxlength="160" placeholder="Toyota Hilux 2020"></label>
<div class="two"><label>السعر (MRU)<input id="price" type="number" min="1" required></label><label>السنة<input id="year" type="number" min="1950" max="2099" required></label><label>الكيلومترات<input id="km" type="number" min="0" value="0"></label><label>الوقود<select id="fuel"><option>ديزل</option><option>بنزين</option><option>هجين</option><option>كهربائي</option></select></label><label>المدينة<select id="city"><option>نواكشوط</option><option>نواذيبو</option><option>الزويرات</option><option>روصو</option><option>كيفه</option><option>أخرى</option></select></label><label>القسم<select id="category"></select></label></div>
<label>حالة الفحص<select id="inspection"><option value="pending">بانتظار الفحص</option><option value="done">تم الفحص</option></select></label><label>صورة السيارة<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"></label><label>أو رابط صورة<input id="imageUrl" type="url" placeholder="https://…"></label><img id="preview" class="preview" hidden alt="معاينة الصورة"><label>الوصف<textarea id="description" rows="4" maxlength="3000"></textarea></label><div class="actions"><button class="primary" id="saveCar">حفظ السيارة</button><button type="button" class="secondary" id="clearForm">تفريغ النموذج</button></div></form></div>
<div><div class="list-heading"><h2>السيارات المنشورة</h2><input id="carSearch" placeholder="بحث بالعنوان أو المدينة"></div><div id="carsList"></div></div></section>
<section id="leadsTab" class="panel" hidden><div class="list-heading"><h2>طلبات الاهتمام</h2><button class="secondary" id="exportLeads">تصدير CSV</button></div><div id="leadsList"></div></section>
<section id="categoriesTab" class="panel" hidden><h2>إدارة الأقسام</h2><form id="categoryForm" class="inline-form"><input id="newCategory" required maxlength="80" placeholder="اسم القسم"><button class="primary">إضافة قسم</button></form><div id="categoriesList"></div></section>
</section></main><div id="toast" role="status"></div><script src="admin.js"></script></body></html>
